"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$kubernetes\
$line_break\
$character
"""

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
format = " [$symbol$branch]($style)"
style = "bold purple"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "bold red"

[python]
symbol = " "
format = " [$symbol$version( $virtualenv)]($style)"
style = "yellow"

[nodejs]
symbol = " "
format = " [$symbol$version]($style)"
style = "green"

[rust]
symbol = " "
format = " [$symbol$version]($style)"
style = "red"

[golang]
symbol = " "
format = " [$symbol$version]($style)"
style = "cyan"

[docker_context]
symbol = " "
format = " [$symbol$context]($style)"
style = "blue"

[kubernetes]
symbol = "󱃾 "
format = " [$symbol$context]($style)"
style = "blue"

[cmd_duration]
min_time = 2000
format = " took [$duration]($style)"
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
